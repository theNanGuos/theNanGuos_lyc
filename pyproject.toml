[project]
name = "the-nanguos"
version = "0.1.0"
description = "Local multi-agent music generation application"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
the-nanguos = "the_nanguos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["the_nanguos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
